global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    # remote-write от коллектора и от Tempo приходит вразнобой по времени
    out_of_order_time_window: 10m

# метрики приложения и span-метрики приходят remote-write, ниже только самотелеметрия
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

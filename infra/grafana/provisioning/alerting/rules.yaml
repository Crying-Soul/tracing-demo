apiVersion: 1

groups:
  - orgId: 1
    name: backend-red
    folder: pet-1
    interval: 1m
    rules:
      - uid: backend-high-error-rate
        title: 'Backend: доля ошибок > 5%'
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Более 5% серверных спанов backend завершаются ошибкой'
          runbook_url: 'https://github.com/'
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                sum(rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
                /
                clamp_min(sum(rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])), 0.0001)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]

      - uid: backend-high-latency
        title: 'Backend: p95 латентности > 1s'
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'p95 времени ответа backend держится выше 1 секунды'
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]

      - uid: collector-dropping-data
        title: 'OTel Collector: телеметрия отбрасывается'
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Коллектор отказывается от спанов/логов/метрик — данные теряются молча'
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                sum(rate(otelcol_processor_refused_spans_total[5m]))
                + sum(rate(otelcol_processor_refused_log_records_total[5m]))
                + sum(rate(otelcol_processor_refused_metric_points_total[5m]))
                + sum(rate(otelcol_exporter_send_failed_spans_total[5m]))
                + sum(rate(otelcol_exporter_send_failed_log_records_total[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    hostname: backend
    profiles: ["backend"]
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=debug
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=backend
    networks:
      - kafka-net
      - observability-net
      - postgres-net
    logging:
      driver: fluentd
      options:
        # адрес хоста, а не имя сервиса: подключается демон, он вне compose-сети
        fluentd-address: localhost:24224
        # без async контейнер не стартует, пока коллектор недоступен
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "{{.Name}}"

  controller-1:
    image: apache/kafka:4.3.1
    container_name: kafka-controller-1
    hostname: controller-1
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      CLUSTER_ID: "01a09f8c-6e18-703f-82d9-a6ef0ecb639e"
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-1-data:/var/lib/kafka/data
    networks:
      - kafka-net

  broker-1:
    image: apache/kafka:4.3.1
    container_name: kafka-broker-1
    hostname: broker-1
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      CLUSTER_ID: "01a09f8c-6e18-703f-82d9-a6ef0ecb639e"
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker-1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - broker-1-data:/var/lib/kafka/data
    networks:
      - kafka-net
    depends_on:
      - controller-1

  postgres-master:
    image: postgres:18
    container_name: postgres-master
    hostname: postgres-master
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./infra/postgres/master/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/master/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/master/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
      - postgres-master-data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-slave:
    image: postgres:18
    container_name: postgres-slave
    hostname: postgres-slave
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      STANDBY_SLOT_NAME: ${STANDBY_SLOT_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./infra/postgres/slave/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/slave/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/slave/setup-slave.sh:/setup-slave.sh:ro
      - postgres-slave-data:/var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/setup-slave.sh"]
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres-master:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    hostname: pgbouncer
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:5432"
    environment:
      DB_HOST: postgres-master
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: "*"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: ${POSTGRES_USER}
      AUTH_TYPE: scram-sha-256
    networks:
      - postgres-net
    depends_on:
      postgres-master:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    hostname: otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:24224:24224"
    networks:
      - observability-net
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml", "-target=all"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability-net]
    healthcheck:
      test: ["CMD", "/tempo", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [observability-net]
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [observability-net]
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [observability-net]
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

networks:
  observability-net:
    driver: bridge
  kafka-net:
    driver: bridge
  postgres-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  controller-1-data:
  broker-1-data:
  postgres-master-data:
  postgres-slave-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
